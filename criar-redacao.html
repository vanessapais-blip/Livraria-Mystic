
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystic — Criar publicação</title>

    <link rel="stylesheet" href="./css/mystic.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171513;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        header {
            min-height: 75px;
            background: #211e1a;
            border-bottom: 1px solid #51432e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            gap: 20px;
        }

        .logo {
            color: #d2ad69;
            font-size: 28px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: #c8c0b3;
            text-decoration: none;
        }

        nav a:hover {
            color: #d2ad69;
        }

        main {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 22px;
        }

        .cabecalho {
            margin-bottom: 30px;
        }

        .cabecalho h1 {
            color: #e0c28b;
            font-size: 35px;
            margin-bottom: 10px;
        }

        .cabecalho p {
            color: #aaa;
            line-height: 1.6;
        }

        .painel {
            background: #211e1a;
            border: 1px solid #51432e;
            border-radius: 15px;
            padding: 30px;
        }

        .campo {
            margin-bottom: 22px;
        }

        .campo label {
            display: block;
            color: #dfc18a;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .campo input,
        .campo select,
        .campo textarea {
            width: 100%;
            background: #171513;
            color: #eee;
            border: 1px solid #51432e;
            border-radius: 9px;
            padding: 14px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {
            border-color: #d2ad69;
        }

        .campo select {
            cursor: pointer;
        }

        .campo textarea {
            min-height: 380px;
            resize: vertical;
            line-height: 1.8;
        }

        .campo textarea::placeholder,
        .campo input::placeholder {
            color: #777;
        }

        .contador {
            text-align: right;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }

        .aviso {
            display: none;
            background: #302719;
            border: 1px solid #80643a;
            color: #dfc18a;
            border-radius: 9px;
            padding: 14px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
        }

        .botao {
            padding: 13px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .salvar {
            background: #302719;
            color: #dfc18a;
            border: 1px solid #80643a;
        }

        .salvar:hover {
            background: #41331f;
        }

        .publicar {
            background: #c5a15a;
            color: #211b10;
        }

        .publicar:hover {
            background: #e0bd78;
        }

        .voltar {
            background: transparent;
            color: #bbb;
            border: 1px solid #51432e;
        }

        .voltar:hover {
            border-color: #c5a15a;
            color: #e0c28b;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 13px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 14px;
        }

        .mensagem.sucesso {
            display: block;
            background: #233025;
            border: 1px solid #52765a;
            color: #b7dfbd;
        }

        .mensagem.erro {
            display: block;
            background: #351f1f;
            border: 1px solid #805050;
            color: #efb2b2;
        }

        footer {
            text-align: center;
            color: #777;
            padding: 35px 15px;
            margin-top: 50px;
            border-top: 1px solid #51432e;
        }

        @media(max-width: 700px) {
            header {
                padding: 18px 20px;
                flex-direction: column;
                align-items: flex-start;
            }

            main {
                margin-top: 30px;
            }

            .painel {
                padding: 20px;
            }

            .cabecalho h1 {
                font-size: 28px;
            }

            .botoes {
                flex-direction: column;
            }

            .botao {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Mystic</div>

    <nav>
        <a href="home.html">Início</a>
        <a href="livros.html">Livros</a>
        <a href="blogs.html">Blogs</a>
        <a href="redacoes.html">Redações</a>
        <a href="perfil.html">👤 Meu perfil</a>
    </nav>
</header>

<main>

    <div class="cabecalho">
        <h1>Criar publicação</h1>
        <p>
            Escreva, salve seus rascunhos e compartilhe suas ideias
            com a comunidade Mystic.
        </p>
    </div>

    <section class="painel">

        <form id="formRedacao">

            <div class="campo">
                <label for="tipo">Modalidade</label>

                <select id="tipo" name="tipo">
                    <option value="redacao">Redação</option>
                    <option value="resenha">Resenha-desafio</option>
                </select>
            </div>

            <div class="aviso" id="avisoResenha">
                <strong>Resenha-desafio ativada.</strong>
                <br>
                Os comandos comuns de copiar, recortar e colar
                serão bloqueados dentro do campo de escrita.
            </div>

            <div class="campo">
                <label for="autor">Nome do autor</label>

                <input
                    type="text"
                    id="autor"
                    placeholder="Nome que aparecerá na publicação"
                    maxlength="60"
                    required
                >
            </div>

            <div class="campo">
                <label for="titulo">Título</label>

                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da sua produção"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo">
                <label for="tema">Tema</label>

                <input
                    type="text"
                    id="tema"
                    placeholder="Informe o tema"
                    maxlength="100"
                    required
                >
            </div>

            <div class="campo">
                <label for="conteudo">Seu texto</label>

                <textarea
                    id="conteudo"
                    placeholder="Comece a escrever aqui..."
                    minlength="30"
                    spellcheck="true"
                    lang="pt-BR"
                    required
                ></textarea>

                <div class="contador">
                    <span id="contador">0</span> caracteres
                </div>
            </div>

            <div class="botoes">

                <button
                    type="button"
                    class="botao salvar"
                    id="botaoSalvar"
                >
                    ♧ Salvar redação
                </button>

                <button
                    type="submit"
                    class="botao publicar"
                >
                    Publicar na Mystic
                </button>

                <button
                    type="button"
                    class="botao voltar"
                    onclick="location.href='redacoes.html'"
                >
                    Voltar
                </button>

            </div>

        </form>

        <div
            id="mensagem"
            class="mensagem"
            role="status"
            aria-live="polite"
        ></div>

    </section>

</main>

<footer>Mystic — Livraria</footer>

<script src="./js/escrever-redacao.js"></script>

</body>
</html>
