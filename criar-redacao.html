<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic — Redações</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#242424;color:#eee;font-family:Arial,sans-serif}
header{min-height:75px;background:#303030;border-bottom:1px solid #444;display:flex;align-items:center;justify-content:space-between;padding:15px 40px;gap:20px}
.logo{font-size:28px;font-weight:bold}
nav{display:flex;gap:22px;flex-wrap:wrap}
nav a{color:#bbb;text-decoration:none}
nav a:hover{color:white}
main{max-width:1000px;margin:50px auto;padding:0 25px}
h1{font-size:38px;margin-bottom:10px}
.descricao{color:#999;line-height:1.6;margin-bottom:30px}
.nova{display:inline-block;background:#c5a15a;color:#211b10;text-decoration:none;padding:13px 20px;border-radius:8px;font-weight:bold;margin-bottom:35px}
.nova:hover{background:#d8b875}
.filtros{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}
.filtro{padding:10px 16px;border:1px solid #555;border-radius:8px;background:#303030;color:#ccc;cursor:pointer}
.filtro.ativo{background:#c5a15a;color:#211b10;border-color:#c5a15a}
.publicacao{background:#303030;border:1px solid #444;border-radius:13px;padding:25px;margin-bottom:20px}
.tipo{display:inline-block;color:#c5a15a;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:bold}
.publicacao h2{font-size:23px;margin-bottom:10px}
.meta{font-size:13px;color:#999;margin-bottom:17px}
.texto{white-space:pre-wrap;line-height:1.7;color:#ddd;overflow-wrap:anywhere}
.vazio{color:#999;text-align:center;padding:45px 20px;background:#303030;border-radius:12px;border:1px solid #444}
footer{text-align:center;color:#777;padding:40px;margin-top:50px;border-top:1px solid #444}
@media(max-width:700px){
 header{padding:18px 20px;flex-direction:column;align-items:flex-start}
 h1{font-size:32px}
 .publicacao{padding:20px}
}
</style>
</head>

<body>

<header>
    <div class="logo">Mystic</div>
    <nav>
        <a href="home.html">Início</a>
        <a href="livros.html">Livros</a>
        <a href="blogs.html">Blogs</a>
        <a href="redacoes.html">Redações</a>
        <a href="perfil.html">👤 Meu perfil</a>
    </nav>
</header>

<main>
    <h1>Redações e resenhas</h1>

    <p class="descricao">
        Conheça as ideias, opiniões e produções da comunidade Mystic.
    </p>

    <a href="escrever-redacao.html" class="nova">
        + Criar publicação
    </a>

    <div class="filtros">
        <button class="filtro ativo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="redacao">Redações</button>
        <button class="filtro" data-filtro="resenha">Resenhas-desafio</button>
    </div>

    <section id="listaPublicacoes"></section>
</main>

<footer>Mystic — Livraria</footer>

<script>
const STORAGE_KEY = "mysticPublicacoes";
const lista = document.getElementById("listaPublicacoes");

let filtroAtual = "todas";

function escaparHTML(valor) {
    return String(valor).replace(/[&<>"']/g, caractere => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[caractere]);
}

function carregarPublicacoes() {
    const publicacoes = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );

    const filtradas = publicacoes.filter(publicacao => {
        return filtroAtual === "todas" ||
               publicacao.tipo === filtroAtual;
    });

    lista.innerHTML = "";

    if (filtradas.length === 0) {
        lista.innerHTML = `
            <div class="vazio">
                Ainda não há publicações nesta categoria.
            </div>
        `;
        return;
    }

    filtradas.forEach(publicacao => {
        const artigo = document.createElement("article");
        artigo.className = "publicacao";

        const tipo = publicacao.tipo === "resenha"
            ? "Resenha-desafio"
            : "Redação";

        artigo.innerHTML = `
            <span class="tipo">${tipo}</span>
            <h2>${escaparHTML(publicacao.titulo)}</h2>
            <p class="meta">
                ${escaparHTML(publicacao.autor)}
                · ${escaparHTML(publicacao.data)}
                · ${escaparHTML(publicacao.tema)}
            </p>
            <div class="texto">${escaparHTML(publicacao.conteudo)}</div>
        `;

        lista.appendChild(artigo);
    });
}

document.querySelectorAll(".filtro").forEach(botao => {
    botao.addEventListener("click", function() {
        document.querySelectorAll(".filtro").forEach(item => {
            item.classList.remove("ativo");
        });

        this.classList.add("ativo");
        filtroAtual = this.dataset.filtro;
        carregarPublicacoes();
    });
});

carregarPublicacoes();
</script>

</body>
</html>
