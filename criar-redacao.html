<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mystic — Escrever Redação</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            background: #242424;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }


        /* CABEÇALHO */

        header {

            min-height: 75px;

            background: #303030;

            border-bottom: 1px solid #444444;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px 40px;

            gap: 20px;
        }


        .logo {

            font-size: 28px;

            font-weight: bold;
        }


        nav {

            display: flex;

            gap: 22px;

            flex-wrap: wrap;
        }


        nav a {

            color: #bbbbbb;

            text-decoration: none;

            font-size: 15px;
        }


        nav a:hover {

            color: white;
        }


        /* CONTEÚDO */

        main {

            max-width: 850px;

            margin: 50px auto;

            padding: 0 25px;
        }


        .voltar {

            display: inline-block;

            color: #bbbbbb;

            text-decoration: none;

            margin-bottom: 30px;
        }


        .voltar:hover {

            color: white;
        }


        h1 {

            font-size: 38px;

            margin-bottom: 10px;
        }


        .descricao {

            color: #999999;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 35px;
        }


        /* FORMULÁRIO */

        .formulario {

            background: #303030;

            border: 1px solid #444444;

            border-radius: 15px;

            padding: 30px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }


        input,
        select,
        textarea {

            width: 100%;

            background: #242424;

            color: white;

            border: 1px solid #555555;

            border-radius: 8px;

            padding: 14px;

            font-size: 15px;

            margin-bottom: 22px;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #777777;
        }


        textarea {

            min-height: 400px;

            resize: vertical;

            line-height: 1.7;
        }


        /* BOTÃO */

        .publicar {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #eeeeee;

            color: #222222;

            font-size: 16px;

            cursor: pointer;
        }


        .publicar:hover {

            background: #cccccc;
        }


        /* MENSAGEM */

        .mensagem {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 8px;

            background: #383838;

            color: #dddddd;

            text-align: center;
        }


        /* RODAPÉ */

        footer {

            text-align: center;

            color: #777777;

            padding: 40px;

            margin-top: 50px;

            border-top: 1px solid #444444;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            header {

                padding: 18px 20px;

                flex-direction: column;

                align-items: flex-start;
            }


            h1 {

                font-size: 32px;
            }


            .formulario {

                padding: 22px;
            }

        }

    </style>

</head>


<body>


    <!-- CABEÇALHO -->

    <header>

        <div class="logo">
            Mystic
        </div>


        <nav>

            <a href="home.html">
                Início
            </a>

            <a href="livros.html">
                Livros
            </a>

            <a href="blogs.html">
                Blogs
            </a>

            <a href="redacoes.html">
                Redações
            </a>

            <a href="perfil.html">
                👤 Meu perfil
            </a>

        </nav>

    </header>



    <!-- CONTEÚDO -->

    <main>


        <a
            href="home.html"
            class="voltar"
        >
            ← Voltar para o início
        </a>



        <h1>
            Escrever uma Redação
        </h1>


        <p class="descricao">

            Escreva sua redação e compartilhe suas ideias
            com a comunidade Mystic.

        </p>



        <div class="formulario">


            <form id="formRedacao">


                <!-- TÍTULO -->

                <label for="titulo">

                    Título da redação

                </label>


                <input
                    type="text"
                    id="titulo"
                    placeholder="Digite o título da sua redação"
                    required
                >



                <!-- TEMA -->

                <label for="tema">

                    Tema

                </label>


                <input
                    type="text"
                    id="tema"
                    placeholder="Qual é o tema da redação?"
                    required
                >



                <!-- AUTOR -->

                <label for="autor">

                    Autor

                </label>


                <input
                    type="text"
                    id="autor"
                    placeholder="Digite seu nome"
                    required
                >



                <!-- REDAÇÃO -->

                <label for="conteudo">

                    Sua redação

                </label>


                <textarea
                    id="conteudo"
                    placeholder="Comece a escrever sua redação..."
                    required
                ></textarea>



                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="publicar"
                >

                    Publicar redação

                </button>


            </form>



            <div
                class="mensagem"
                id="mensagem"
            >

                Sua redação foi preparada para publicação.

            </div>


        </div>


    </main>



    <!-- RODAPÉ -->

    <footer>

        Mystic — Livraria

    </footer>



    <script>

        document
            .getElementById("formRedacao")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const mensagem =
                        document.getElementById(
                            "mensagem"
                        );


                    mensagem.style.display =
                        "block";


                    mensagem.textContent =
                        "Sua redação foi preparada para publicação.";

                }
            );

    </script>


</body>

</html>
