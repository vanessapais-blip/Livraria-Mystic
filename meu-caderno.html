
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0d">
  <title>Meu Caderno | Mystic Livraria">

  <style>
    :root {
      color-scheme: dark;
      --bg: #100e0d;
      --panel: #191613;
      --panel2: #211d19;
      --field: #151210;
      --border: #393027;
      --text: #f4eee5;
      --muted: #b9afa2;
      --gold: #c9a45c;
      --gold-light: #e2c783;
      --gold-bg: #302719;
      --danger: #e78d83;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 Arial, Helvetica, sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }

    button { cursor: pointer; }

    a {
      color: inherit;
      text-decoration: none;
    }

    button:focus-visible, a:focus-visible,
    input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 72px;
      padding: 12px clamp(12px, 4vw, 56px);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .back {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--panel);
      color: var(--gold-light);
      font-size: 24px;
    }

    .back:hover { background: var(--gold-bg); }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .brand-name {
      color: var(--gold-light);
      font: bold clamp(23px, 2.5vw, 30px) Georgia, "Times New Roman", serif;
      letter-spacing: 1px;
    }

    .top-search {
      position: relative;
      width: min(360px, 40%);
      margin-left: auto;
    }

    .top-search input {
      width: 100%;
      min-height: 42px;
      padding: 10px 40px 10px 14px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--field);
      color: var(--text);
    }

    .search-icon {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: var(--gold);
      pointer-events: none;
      font-size: 19px;
    }

    .layout {
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
      width: 100%;
      max-width: 1440px;
      min-height: calc(100vh - 72px);
      margin: 0 auto;
    }

    .sidebar {
      padding: 25px 13px;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }

    .sidebar-title {
      padding: 0 12px 13px;
      color: var(--gold);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .nav-list { display: grid; gap: 5px; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .nav-link:hover, .nav-link.active {
      background: var(--gold-bg);
      border-color: var(--border);
      color: var(--text);
    }

    .nav-icon {
      display: inline-grid;
      width: 20px;
      flex: 0 0 20px;
      place-items: center;
      color: var(--gold);
      font-size: 17px;
    }

    main {
      width: 100%;
      min-width: 0;
      padding: 30px clamp(14px, 3vw, 42px) 45px;
    }

    .page-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .page-icon {
      flex: 0 0 auto;
      color: var(--gold);
      font-size: 30px;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 3px;
      font: 29px/1.25 Georgia, "Times New Roman", serif;
    }

    h2 {
      margin: 0 0 4px;
      font: 19px/1.3 Georgia, "Times New Roman", serif;
    }

    .muted, .description { color: var(--muted); }

    .description {
      margin-bottom: 0;
      font-size: 13px;
    }

    .status {
      min-height: 18px;
      margin: 0 0 12px;
      color: var(--gold-light);
      font-size: 12px;
    }

    .card {
      min-width: 0;
      padding: clamp(14px, 1.7vw, 20px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin-bottom: 15px;
    }

    .card-icon {
      width: 27px;
      flex: 0 0 27px;
      color: var(--gold);
      text-align: center;
      font-size: 22px;
      line-height: 1.3;
    }

    .card-description {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .toolbar select {
      flex: 0 1 180px;
      min-height: 40px;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--field);
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel2);
      color: var(--text);
      font-size: 12px;
      text-align: center;
      transition: border-color .2s, color .2s;
    }

    .btn:hover {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn-primary {
      border-color: var(--gold);
      background: var(--gold);
      color: #1a140a;
      font-weight: bold;
    }

    .btn-primary:hover { color: #1a140a; filter: brightness(1.08); }

    .btn-danger { color: var(--danger); }

    .editor {
      display: grid;
      gap: 14px;
      margin-bottom: 22px;
    }

    .field { min-width: 0; }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .field input[type="text"],
    .field textarea,
    .field select,
    .field input[type="file"] {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--field);
      color: var(--text);
    }

    .field textarea {
      min-height: 190px;
      resize: vertical;
      line-height: 1.8;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #938779;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 9px;
    }

    .image-preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      object-position: left center;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--field);
    }

    .image-preview.visible { display: block; }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .note-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .2s;
    }

    .note-card:hover { border-color: var(--gold); }

    .note-image {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      background: var(--panel2);
      border-bottom: 1px solid var(--border);
    }

    .note-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 16px;
    }

    .note-category {
      display: inline-block;
      align-self: flex-start;
      margin-bottom: 9px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--gold-bg);
      color: var(--gold-light);
      font-size: 10px;
    }

    .note-title {
      margin-bottom: 8px;
      overflow-wrap: anywhere;
      font: 20px/1.35 Georgia, "Times New Roman", serif;
    }

    .note-preview {
      flex: 1;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
      overflow: hidden;
    }

    .note-date {
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 11px;
    }

    .note-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: auto;
    }

    .note-actions .btn { flex: 1 1 auto; }

    .empty {
      padding: 35px 18px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      display: block;
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 35px;
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font: 20px Georgia, "Times New Roman", serif;
    }

    .note-info {
      margin-top: 18px;
      padding: 11px;
      border-radius: 7px;
      background: var(--panel2);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .hidden { display: none !important; }

    footer {
      display: flex;
      justify-content: center;
      padding: 22px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--gold-light);
      font: 19px Georgia, "Times New Roman", serif;
      text-align: center;
    }

    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }

      .sidebar {
        position: sticky;
        top: 72px;
        z-index: 10;
        padding: 9px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-title { padding: 0 5px 7px; }

      .nav-list {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
        padding-bottom: 3px;
      }

      .nav-link {
        flex: 0 0 auto;
        min-height: 38px;
        padding: 8px 11px;
        white-space: nowrap;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 10px;
        padding: 10px 12px;
      }

      .back {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 22px;
      }

      .brand { gap: 8px; }

      .brand img {
        width: 36px;
        height: 36px;
      }

      .brand-name { font-size: 25px; }

      .top-search {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
      }

      .sidebar {
        top: 0;
        padding: 8px 10px;
      }

      main { padding: 20px 12px 30px; }

      .page-title {
        gap: 10px;
        margin-bottom: 19px;
      }

      .page-icon { font-size: 26px; }
      h1 { font-size: 25px; }

      .note-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 13px;
      }

      .card {
        padding: 15px;
        border-radius: 10px;
      }

      .toolbar select { flex: 1 1 140px; }

      .editor-actions .btn { flex: 1 1 auto; }

      .note-content { padding: 14px; }
      .note-title { font-size: 19px; }
    }

    @media (max-width: 380px) {
      .brand-name { font-size: 23px; }
      main { padding-right: 9px; padding-left: 9px; }
      .card { padding: 12px; }
      .note-content { padding: 12px; }
      .note-actions .btn { font-size: 11px; padding: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="back" href="home.html" aria-label="Voltar para a página inicial" title="Voltar">&#8592;</a>

    <a class="brand" href="home.html" aria-label="Mystic - início">
      <img src="logo-mystic.jpg" alt="Logo Mystic">
      <span class="brand-name">Mystic</span>
    </a>

    <div class="top-search">
      <input id="buscaTopo" type="search" placeholder="Pesquisar no meu caderno..." aria-label="Pesquisar anotações">
      <span class="search-icon" aria-hidden="true">&#8981;</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Meu espaço</div>
      <nav class="nav-list" aria-label="Navegação do caderno">
        <a class="nav-link active" href="#inicio"><span class="nav-icon">⌂</span>Visão geral</a>
        <a class="nav-link" href="#editor"><span class="nav-icon">✎</span>Nova anotação</a>
        <a class="nav-link" href="#anotacoes"><span class="nav-icon">▤</span>Minhas anotações</a>
        <a class="nav-link" href="#favoritas"><span class="nav-icon">♡</span>Favoritas</a>
      </nav>
    </aside>

    <main>
      <section id="inicio">
        <div class="page-title">
          <span class="page-icon" aria-hidden="true">▤</span>
          <div>
            <h1>Meu Caderno</h1>
            <p class="muted description">Seu espaço pessoal para ideias, leituras e inspirações.</p>
          </div>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="toolbar">
          <button class="btn btn-primary" id="novaAnotacao" type="button">＋ Nova anotação</button>
          <select id="filtroCategoria" aria-label="Filtrar por categoria">
            <option value="">Todas as categorias</option>
            <option value="Leitura">Leitura</option>
            <option value="Ideias">Ideias</option>
            <option value="Citações">Citações</option>
            <option value="Pessoal">Pessoal</option>
            <option value="Outros">Outros</option>
          </select>
          <select id="filtroOrdem" aria-label="Ordenar anotações">
            <option value="recentes">Mais recentes</option>
            <option value="antigas">Mais antigas</option>
            <option value="titulo">Ordem alfabética</option>
          </select>
        </div>
      </section>

      <section class="card editor hidden" id="editor" aria-labelledby="editorTitulo">
        <div class="card-header">
          <span class="card-icon">✎</span>
          <div>
            <h2 id="editorTitulo">Nova anotação</h2>
            <p class="card-description">Registre seus pensamentos e guarde suas inspirações.</p>
          </div>
        </div>

        <form id="formAnotacao">
          <input type="hidden" id="notaId">

          <div class="field">
            <label for="tituloNota">Título</label>
            <input id="tituloNota" type="text" maxlength="120" placeholder="Dê um título à sua anotação" required>
          </div>

          <div class="field">
            <label for="categoriaNota">Categoria</label>
            <select id="categoriaNota">
              <option value="Leitura">Leitura</option>
              <option value="Ideias">Ideias</option>
              <option value="Citações">Citações</option>
              <option value="Pessoal">Pessoal</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <div class="field">
            <label for="textoNota">Sua anotação</label>
            <textarea id="textoNota" placeholder="Escreva aqui seus pensamentos, trechos favoritos ou ideias..." required></textarea>
          </div>

          <div class="field">
            <label for="fotoNota">Adicionar foto (opcional)</label>
            <input id="fotoNota" type="file" accept="image/*">
            <img id="previewFoto" class="image-preview" alt="Prévia da foto escolhida">
            <p class="card-description" style="margin-top:7px">Escolha uma imagem de até 2 MB para ilustrar a anotação.</p>
          </div>

          <div class="setting-row" style="display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--border);margin-top:12px">
            <input id="favoritaNota" type="checkbox" style="width:19px;height:19px;accent-color:var(--gold)">
            <label for="favoritaNota">Adicionar às favoritas</label>
          </div>

          <div class="editor-actions">
            <button class="btn" id="cancelarEdicao" type="button">Cancelar</button>
            <button class="btn btn-primary" type="submit">Salvar anotação</button>
          </div>
        </form>
      </section>

      <section id="anotacoes">
        <div class="card-header">
          <span class="card-icon">▤</span>
          <div>
            <h2>Minhas anotações</h2>
            <p class="card-description">Tudo o que você deseja guardar em um só lugar.</p>
          </div>
        </div>

        <div id="listaAnotacoes" class="note-grid"></div>

        <div id="vazio" class="empty hidden">
          <span class="empty-icon">✧</span>
          <strong>Seu caderno está esperando por você</strong>
          <p>Crie sua primeira anotação para guardar ideias, leituras e momentos especiais.</p>
          <button class="btn btn-primary" id="criarPrimeira" type="button">＋ Criar anotação</button>
        </div>
      </section>

      <section id="favoritas" style="margin-top:28px">
        <div class="card-header">
          <span class="card-icon">♡</span>
          <div>
            <h2>Anotações favoritas</h2>
            <p class="card-description">Acesse rapidamente as anotações que marcou como favoritas.</p>
          </div>
        </div>
        <div id="listaFavoritas" class="note-grid"></div>
        <p id="vazioFavoritas" class="note-info hidden">Você ainda não marcou nenhuma anotação como favorita.</p>
      </section>

      <p class="note-info">
        Suas anotações ficam salvas neste navegador. Se limpar os dados do navegador ou trocar de dispositivo, elas podem não estar disponíveis. Exporte uma cópia se quiser guardar um backup.
      </p>

      <div class="toolbar" style="margin-top:14px">
        <button class="btn" id="exportar" type="button">⇩ Exportar backup</button>
        <button class="btn btn-danger" id="apagarTudo" type="button">Apagar todas as anotações</button>
      </div>
    </main>
  </div>

  <footer>Mystic Livraria</footer>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "mysticMeuCadernoV1";
      const $ = id => document.getElementById(id);

      let anotacoes = [];
      let fotoAtual = "";

      function mostrarStatus(mensagem) {
        $("status").textContent = mensagem;
      }

      function carregarAnotacoes() {
        try {
          const dados = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          anotacoes = Array.isArray(dados) ? dados.filter(item =>
            item && typeof item.id === "string" &&
            typeof item.titulo === "string" &&
            typeof item.texto === "string"
          ) : [];
        } catch {
          anotacoes = [];
        }
      }

      function salvarAnotacoes(mensagem = "Anotação salva neste navegador.") {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(anotacoes));
          mostrarStatus(mensagem);
          renderizar();
        } catch {
          mostrarStatus("Não foi possível salvar. Tente remover a foto ou usar uma imagem menor.");
        }
      }

      function dataFormatada(valor) {
        const data = new Date(valor);
        if (Number.isNaN(data.getTime())) return "Data não disponível";
        return data.toLocaleString("pt-BR", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function escaparHTML(valor) {
        return String(valor).replace(/[&<>"']/g, caractere => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[caractere]);
      }

      function criarCartao(nota) {
        const article = document.createElement("article");
        article.className = "note-card";

        if (nota.foto) {
          const img = document.createElement("img");
          img.className = "note-image";
          img.src = nota.foto;
          img.alt = "Foto da anotação " + nota.titulo;
          img.loading = "lazy";
          article.appendChild(img);
        }

        const content = document.createElement("div");
        content.className = "note-content";

        const category = document.createElement("span");
        category.className = "note-category";
        category.textContent = nota.categoria || "Outros";

        const title = document.createElement("h3");
        title.className = "note-title";
        title.textContent = nota.titulo;

        const preview = document.createElement("p");
        preview.className = "note-preview";
        preview.textContent = nota.texto;

        const date = document.createElement("p");
        date.className = "note-date";
        date.textContent = (nota.favorita ? "♡ Favorita · " : "") +
          "Atualizada em " + dataFormatada(nota.atualizada || nota.criada);

        const actions = document.createElement("div");
        actions.className = "note-actions";

        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "btn";
        edit.textContent = "Editar";
        edit.addEventListener("click", () => editarAnotacao(nota.id));

        const favorite = document.createElement("button");
        favorite.type = "button";
        favorite.className = "btn";
        favorite.textContent = nota.favorita ? "♡ Favorita" : "☆ Favoritar";
        favorite.setAttribute("aria-pressed", String(Boolean(nota.favorita)));
        favorite.addEventListener("click", () => alternarFavorita(nota.id));

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "btn btn-danger";
        remove.textContent = "Excluir";
        remove.addEventListener("click", () => excluirAnotacao(nota.id));

        actions.append(edit, favorite, remove);
        content.append(category, title, preview, date, actions);
        article.appendChild(content);

        return article;
      }

      function obterAnotacoesFiltradas(lista) {
        const busca = $("buscaTopo").value.trim().toLocaleLowerCase("pt-BR");
        const categoria = $("filtroCategoria").value;
        const ordem = $("filtroOrdem").value;

        const filtradas = lista.filter(nota => {
          const correspondeBusca = !busca ||
            (nota.titulo + " " + nota.texto + " " + nota.categoria)
              .toLocaleLowerCase("pt-BR").includes(busca);
          const correspondeCategoria = !categoria || nota.categoria === categoria;
          return correspondeBusca && correspondeCategoria;
        });

        filtradas.sort((a, b) => {
          if (ordem === "titulo") return a.titulo.localeCompare(b.titulo, "pt-BR");
          const dataA = new Date(a.atualizada || a.criada).getTime() || 0;
          const dataB = new Date(b.atualizada || b.criada).getTime() || 0;
          return ordem === "antigas" ? dataA - dataB : dataB - dataA;
        });

        return filtradas;
      }

      function renderizar() {
        const filtradas = obterAnotacoesFiltradas(anotacoes);
        const lista = $("listaAnotacoes");
        const favoritas = $("listaFavoritas");

        lista.replaceChildren();
        favoritas.replaceChildren();

        filtradas.forEach(nota => lista.appendChild(criarCartao(nota)));

        const favoritasFiltradas = obterAnotacoesFiltradas(
          anotacoes.filter(nota => nota.favorita)
        );

        favoritasFiltradas.forEach(nota => favoritas.appendChild(criarCartao(nota)));

        $("vazio").classList.toggle("hidden", filtradas.length > 0);
        $("vazioFavoritas").classList.toggle("hidden", favoritasFiltradas.length > 0);

        if (anotacoes.length === 0) {
          $("vazio").classList.remove("hidden");
        } else if (filtradas.length === 0) {
          $("vazio").classList.remove("hidden");
          $("vazio").querySelector("strong").textContent = "Nenhuma anotação encontrada";
          $("vazio").querySelector("p").textContent = "Tente mudar a pesquisa ou o filtro de categoria.";
          $("criarPrimeira").classList.add("hidden");
        } else {
          $("vazio").querySelector("strong").textContent = "Seu caderno está esperando por você";
          $("vazio").querySelector("p").textContent = "Crie sua primeira anotação para guardar ideias, leituras e momentos especiais.";
          $("criarPrimeira").classList.remove("hidden");
        }
      }

      function abrirEditor(nota = null) {
        $("editor").classList.remove("hidden");
        $("editorTitulo").textContent = nota ? "Editar anotação" : "Nova anotação";
        $("notaId").value = nota ? nota.id : "";
        $("tituloNota").value = nota ? nota.titulo : "";
        $("categoriaNota").value = nota ? nota.categoria : "Leitura";
        $("textoNota").value = nota ? nota.texto : "";
        $("favoritaNota").checked = nota ? Boolean(nota.favorita) : false;
        fotoAtual = nota ? (nota.foto || "") : "";

        $("fotoNota").value = "";
        $("previewFoto").src = fotoAtual;
        $("previewFoto").classList.toggle("visible", Boolean(fotoAtual));

        $("editor").scrollIntoView({ behavior: "smooth", block: "start" });
        $("tituloNota").focus({ preventScroll: true });
      }

      function fecharEditor() {
        $("editor").classList.add("hidden");
        $("formAnotacao").reset();
        $("notaId").value = "";
        fotoAtual = "";
        $("previewFoto").removeAttribute("src");
        $("previewFoto").classList.remove("visible");
      }

      function editarAnotacao(id) {
        const nota = anotacoes.find(item => item.id === id);
        if (nota) abrirEditor(nota);
      }

      function alternarFavorita(id) {
        const nota = anotacoes.find(item => item.id === id);
        if (!nota) return;
        nota.favorita = !nota.favorita;
        nota.atualizada = new Date().toISOString();
        salvarAnotacoes(nota.favorita
          ? "Anotação adicionada às favoritas."
          : "Anotação removida das favoritas.");
      }

      function excluirAnotacao(id) {
        const nota = anotacoes.find(item => item.id === id);
        if (!nota) return;
        if (!confirm('Deseja excluir a anotação "' + nota.titulo + '"?')) return;

        anotacoes = anotacoes.filter(item => item.id !== id);
        salvarAnotacoes("Anotação excluída.");
      }

      $("fotoNota").addEventListener("change", event => {
        const arquivo = event.target.files && event.target.files[0];
        if (!arquivo) return;

        if (!arquivo.type.startsWith("image/")) {
          mostrarStatus("Escolha um arquivo de imagem válido.");
          event.target.value = "";
          return;
        }

        if (arquivo.size > 2 * 1024 * 1024) {
          mostrarStatus("Escolha uma imagem de até 2 MB.");
          event.target.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          fotoAtual = typeof reader.result === "string" ? reader.result : "";
          $("previewFoto").src = fotoAtual;
          $("previewFoto").classList.toggle("visible", Boolean(fotoAtual));
        };
        reader.onerror = () => mostrarStatus("Não foi possível carregar a imagem.");
        reader.readAsDataURL(arquivo);
      });

      $("formAnotacao").addEventListener("submit", event => {
        event.preventDefault();

        const titulo = $("tituloNota").value.trim();
        const texto = $("textoNota").value.trim();

        if (!titulo || !texto) {
          mostrarStatus("Preencha o título e o texto da anotação.");
          return;
        }

        const id = $("notaId").value;
        const existente = anotacoes.find(item => item.id === id);
        const agora = new Date().toISOString();

        const nota = {
          id: existente ? existente.id : (
            window.crypto && crypto.randomUUID
              ? crypto.randomUUID()
              : String(Date.now()) + Math.random().toString(16).slice(2)
          ),
          titulo,
          texto,
          categoria: $("categoriaNota").value,
          favorita: $("favoritaNota").checked,
          foto: fotoAtual,
          criada: existente ? existente.criada : agora,
          atualizada: agora
        };

        if (existente) {
          anotacoes = anotacoes.map(item => item.id === id ? nota : item);
        } else {
          anotacoes.unshift(nota);
        }

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(anotacoes));
          fecharEditor();
          renderizar();
          mostrarStatus(existente ? "Anotação atualizada." : "Anotação criada com sucesso.");
        } catch {
          mostrarStatus("Não foi possível salvar. Tente remover a foto ou escolher uma imagem menor.");
        }
      });

      $("novaAnotacao").addEventListener("click", () => abrirEditor());
      $("criarPrimeira").addEventListener("click", () => abrirEditor());
      $("cancelarEdicao").addEventListener("click", fecharEditor);

      $("buscaTopo").addEventListener("input", renderizar);
      $("filtroCategoria").addEventListener("change", renderizar);
      $("filtroOrdem").addEventListener("change", renderizar);

      $("apagarTudo").addEventListener("click", () => {
        if (!anotacoes.length) {
          mostrarStatus("Não há anotações para apagar.");
          return;
        }

        if (!confirm("Tem certeza de que deseja apagar todas as anotações? Esta ação não pode ser desfeita.")) return;

        anotacoes = [];
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch {}
        fecharEditor();
        renderizar();
        mostrarStatus("Todas as anotações foram apagadas.");
      });

      $("exportar").addEventListener("click", () => {
        const arquivo = new Blob(
          [JSON.stringify(anotacoes, null, 2)],
          { type: "application/json;charset=utf-8" }
        );

        const url = URL.createObjectURL(arquivo);
        const link = document.createElement("a");
        link.href = url;
        link.download = "mystic-meu-caderno-backup.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        mostrarStatus("Backup preparado para exportação.");
      });

      document.querySelectorAll(".nav-link").forEach(link => {
        link.addEventListener("click", () => {
          document.querySelectorAll(".nav-link").forEach(item => item.classList.remove("active"));
          link.classList.add("active");
        });
      });

      carregarAnotacoes();
      renderizar();
    })();
  </script>
</body>
</html>
