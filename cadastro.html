<script>
  "use strict";

  // =====================================
  // MODO DESENVOLVEDOR
  // =====================================

  const PIN_DESENVOLVEDOR = "2354";

  const abrirAcessoDev = document.getElementById("abrirAcessoDev");
  const modalDev = document.getElementById("modalDev");
  const formDev = document.getElementById("formDev");
  const pinDev = document.getElementById("pinDev");
  const feedbackDev = document.getElementById("feedbackDev");
  const painelDev = document.getElementById("painelDev");

  abrirAcessoDev.addEventListener("click", function () {
    modalDev.classList.add("aberto");
    feedbackDev.textContent = "";
    pinDev.value = "";
    pinDev.focus();
  });

  document.getElementById("fecharModalDev").addEventListener("click", function () {
    modalDev.classList.remove("aberto");
    pinDev.value = "";
  });

  modalDev.addEventListener("click", function (evento) {
    if (evento.target === modalDev) {
      modalDev.classList.remove("aberto");
      pinDev.value = "";
    }
  });

  formDev.addEventListener("submit", function (evento) {
    evento.preventDefault();

    if (pinDev.value === PIN_DESENVOLVEDOR) {
      modalDev.classList.remove("aberto");
      painelDev.classList.add("aberto");

      atualizarDiagnosticoDev();

      pinDev.value = "";
      feedbackDev.textContent = "";

    } else {
      feedbackDev.textContent =
        "PIN incorreto. Verifique e tente novamente.";

      pinDev.value = "";
      pinDev.focus();
    }
  });

  function atualizarDiagnosticoDev() {

    document.getElementById("devPagina").textContent =
      window.location.pathname;

    document.getElementById("devNavegador").textContent =
      navigator.userAgent;

    document.getElementById("devData").textContent =
      new Date().toLocaleString("pt-BR");

    try {

      const contas = JSON.parse(
        localStorage.getItem("mysticContas") || "[]"
      );

      document.getElementById("devContas").textContent =
        Array.isArray(contas)
          ? String(contas.length)
          : "Dados inválidos";

      const bytes = new Blob([
        JSON.stringify(localStorage)
      ]).size;

      document.getElementById("devArmazenamento").textContent =
        (bytes / 1024).toFixed(2) +
        " KB usados aproximadamente";

    } catch (erro) {

      document.getElementById("devContas").textContent =
        "Não foi possível ler";

      document.getElementById("devArmazenamento").textContent =
        "Indisponível";

    }
  }

  document.getElementById("sairDev").addEventListener("click", function () {
    painelDev.classList.remove("aberto");
  });


  // =====================================
  // SISTEMA DE CADASTRO
  // =====================================

  const CHAVE_CONTAS = "mysticContas";

  const formulario = document.getElementById("formCadastro");
  const campoNome = document.getElementById("nome");
  const campoEmail = document.getElementById("email");
  const campoSenha = document.getElementById("senha");
  const campoConfirmarSenha =
    document.getElementById("confirmarSenha");

  const botaoCadastro =
    document.getElementById("botaoCadastro");

  const mensagem =
    document.getElementById("mensagem");

  let cadastroEmAndamento = false;


  // Mostrar ou ocultar as senhas.

  document.querySelectorAll(".mostrar-senha").forEach(function (botao) {

    botao.addEventListener("click", function () {

      const campo = document.getElementById(
        this.getAttribute("data-alvo")
      );

      if (campo.type === "password") {

        campo.type = "text";
        this.textContent = "Ocultar";

      } else {

        campo.type = "password";
        this.textContent = "Mostrar";

      }

    });

  });


  // Apresentar mensagens no formulário.

  function mostrarMensagem(texto, tipo) {

    mensagem.textContent = texto;
    mensagem.className = "mensagem " + tipo;

  }

  function limparMensagem() {

    mensagem.textContent = "";
    mensagem.className = "mensagem";

  }


  // Ler contas já cadastradas.

  function lerContas() {

    const dados = localStorage.getItem(CHAVE_CONTAS);

    if (!dados) {
      return [];
    }

    const contas = JSON.parse(dados);

    if (!Array.isArray(contas)) {
      throw new Error("DADOS_INVALIDOS");
    }

    return contas;

  }


  // Converter bytes em Base64.

  function bytesParaBase64(bytes) {

    let binario = "";

    for (let i = 0; i < bytes.length; i++) {

      binario += String.fromCharCode(bytes[i]);

    }

    return btoa(binario);

  }


  // Gerar hash da senha com PBKDF2-SHA-256.

  async function gerarHashSenha(senha, salt) {

    if (!window.crypto || !window.crypto.subtle) {
      throw new Error("CRIPTOGRAFIA_INDISPONIVEL");
    }

    const codificador = new TextEncoder();

    const chave = await crypto.subtle.importKey(
      "raw",
      codificador.encode(senha),
      "PBKDF2",
      false,
      ["deriveBits"]
    );

    const resultado = await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 210000,
        hash: "SHA-256"
      },
      chave,
      256
    );

    return bytesParaBase64(
      new Uint8Array(resultado)
    );

  }


  // Verificar se o e-mail já está cadastrado.

  function emailJaExiste(contas, email) {

    return contas.some(function (conta) {

      return (
        conta &&
        typeof conta.email === "string" &&
        conta.email.trim().toLowerCase() === email
      );

    });

  }


  // Criar uma nova conta.

  formulario.addEventListener("submit", async function (evento) {

    evento.preventDefault();

    if (cadastroEmAndamento) {
      return;
    }

    limparMensagem();

    const nome = campoNome.value.trim();
    const email = campoEmail.value.trim().toLowerCase();
    const senha = campoSenha.value;
    const confirmarSenha = campoConfirmarSenha.value;


    // Validar os campos.

    if (!nome || !email || !senha || !confirmarSenha) {

      mostrarMensagem(
        "Preencha todos os campos para continuar.",
        "erro"
      );

      return;
    }

    if (nome.length < 2) {

      mostrarMensagem(
        "Digite um nome com pelo menos 2 caracteres.",
        "erro"
      );

      return;
    }

    if (senha.length < 8) {

      mostrarMensagem(
        "A senha precisa ter pelo menos 8 caracteres.",
        "erro"
      );

      return;
    }

    if (senha.length > 128) {

      mostrarMensagem(
        "A senha não pode ultrapassar 128 caracteres.",
        "erro"
      );

      return;
    }

    if (senha !== confirmarSenha) {

      mostrarMensagem(
        "As senhas não correspondem. Digite novamente.",
        "erro"
      );

      return;
    }


    cadastroEmAndamento = true;

    botaoCadastro.disabled = true;
    botaoCadastro.textContent = "Criando conta...";


    try {

      // Recuperar a lista atual de contas.

      const contas = lerContas();


      // Impedir o uso de um e-mail já cadastrado.

      if (emailJaExiste(contas, email)) {

        mostrarMensagem(
          "Este e-mail já está cadastrado. Volte ao login para entrar.",
          "erro"
        );

        return;
      }


      if (
        !window.crypto ||
        !window.crypto.getRandomValues ||
        !window.crypto.subtle
      ) {

        throw new Error("CRIPTOGRAFIA_INDISPONIVEL");

      }


      // Criar salt aleatório para a senha.

      const salt = crypto.getRandomValues(
        new Uint8Array(16)
      );


      // Gerar o hash da senha.

      const senhaHash = await gerarHashSenha(
        senha,
        salt
      );


      // Preparar os dados da conta.

      const novaConta = {

        nome: nome,
        email: email,

        salt: bytesParaBase64(salt),

        senhaHash: senhaHash,

        algoritmo: "PBKDF2-SHA-256",

        iteracoes: 210000,

        criadoEm: new Date().toISOString()

      };


      // Acrescentar a conta à lista.

      contas.push(novaConta);


      // Salvar todas as contas no navegador.

      localStorage.setItem(
        CHAVE_CONTAS,
        JSON.stringify(contas)
      );


      mostrarMensagem(
        "Conta criada com sucesso! Você será encaminhado para o login.",
        "sucesso"
      );

      botaoCadastro.textContent = "Conta criada!";


      // Ir para o login após concluir o cadastro.

      setTimeout(function () {

        window.location.href =
          "index.html?cadastro=sucesso";

      }, 1200);


    } catch (erro) {

      console.error("Erro ao criar conta:", erro);


      if (erro.message === "CRIPTOGRAFIA_INDISPONIVEL") {

        mostrarMensagem(
          "Não foi possível ativar a proteção da senha. " +
          "Abra o projeto pelo Live Server do VS Code ou por HTTPS.",
          "erro"
        );

      } else if (erro.name === "QuotaExceededError") {

        mostrarMensagem(
          "O navegador não tem espaço disponível para salvar a conta.",
          "erro"
        );

      } else if (erro.message === "DADOS_INVALIDOS") {

        mostrarMensagem(
          "Os dados das contas estão inválidos. Verifique o armazenamento do navegador.",
          "erro"
        );

      } else {

        mostrarMensagem(
          "Ocorreu um erro ao criar a conta. Tente novamente.",
          "erro"
        );

      }


    } finally {

      cadastroEmAndamento = false;

      if (botaoCadastro.textContent === "Criando conta...") {

        botaoCadastro.textContent = "Criar minha conta";

      }

      botaoCadastro.disabled = false;

    }
  });

</script>

</body>
</html>
