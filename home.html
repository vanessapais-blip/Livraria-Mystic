<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mystic — Início</title>

  <style>
    :root {
      --fundo: #0c0d0f;
      --fundo-secundario: #121416;
      --painel: #17191b;
      --painel-hover: #202225;
      --dourado: #d4af5a;
      --dourado-claro: #f0cf83;
      --texto: #f5f5f5;
      --texto-secundario: #c2c5cc;
      --borda: #343536;
      --sombra: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at top right, #1b1913 0%, transparent 40%),
        var(--fundo);
      color: var(--texto);
    }

    body.menu-aberto {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--dourado-claro);
      outline-offset: 4px;
    }

    /* CABEÇALHO */

    header {
      height: 86px;
      padding: 0 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      background: rgba(17, 18, 20, 0.96);
      border-bottom: 1px solid #34312a;

      position: sticky;
      top: 0;
      z-index: 15;

      backdrop-filter: blur(15px);
    }

    .lado-esquerdo {
      display: flex;
      align-items: center;
      gap: 28px;
      min-width: 0;
    }

    .botao-menu {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;

      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;

      color: var(--texto);
      cursor: pointer;
      transition: 0.2s;
    }

    .botao-menu:hover {
      background: var(--painel-hover);
      border-color: var(--borda);
    }

    .icone-hamburguer {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .icone-hamburguer span {
      display: block;
      width: 23px;
      height: 2px;
      border-radius: 3px;
      background: var(--texto);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;

      color: var(--dourado-claro);
      text-decoration: none;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 33px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border-radius: 8px;
    }

    .link-livros {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 135px;
      padding: 13px 24px;

      border: 1px solid #49443a;
      border-radius: 10px;

      background: #202124;
      color: var(--texto);

      text-decoration: none;
      font-weight: 600;

      transition: 0.2s;
    }

    .link-livros:hover {
      border-color: var(--dourado);
      color: var(--dourado-claro);
      background: #28251e;
    }

    /* FUNDO DO MENU */

    .fundo-menu {
      position: fixed;
      inset: 0;
      z-index: 19;

      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .fundo-menu.aberto {
      opacity: 1;
      visibility: visible;
    }

    /* MENU LATERAL */

    .menu-lateral {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;

      width: 275px;
      max-width: 86vw;

      padding: 26px 18px;
      overflow-y: auto;

      background: #111315;
      border-right: 1px solid var(--borda);

      transform: translateX(-105%);
      transition: transform 0.28s ease;

      z-index: 20;
    }

    .menu-lateral.aberto {
      transform: translateX(0);
    }

    .topo-menu {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 7px 24px;
      margin-bottom: 15px;

      border-bottom: 1px solid var(--borda);
    }

    .topo-menu h2 {
      color: var(--dourado-claro);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
    }

    .fechar-menu {
      width: 38px;
      height: 38px;

      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;

      color: var(--texto-secundario);
      font-size: 28px;
      cursor: pointer;
      transition: 0.2s;
    }

    .fechar-menu:hover {
      background: var(--painel-hover);
      color: white;
    }

    .menu-lateral a {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 14px 13px;
      margin-bottom: 6px;

      color: var(--texto-secundario);
      text-decoration: none;
      font-size: 15px;

      border: 1px solid transparent;
      border-radius: 9px;

      transition: 0.2s;
    }

    .menu-lateral a:hover {
      background: #202124;
      color: var(--texto);
    }

    .menu-lateral a.ativo {
      color: var(--dourado-claro);
      background: linear-gradient(
        100deg,
        rgba(212, 175, 90, 0.2),
        rgba(212, 175, 90, 0.06)
      );
      border-color: rgba(212, 175, 90, 0.22);
    }

    .icone-menu {
      width: 24px;
      height: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
      color: currentColor;
    }

    .icone-menu svg {
      width: 22px;
      height: 22px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .titulo-menu {
      color: #a9a9a9;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;

      margin: 27px 12px 13px;
    }

    /* ESTRUTURA DA PÁGINA */

    .estrutura {
      min-height: calc(100vh - 86px);
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 1450px;

      flex: 1;

      margin: 0 auto;
      padding: 45px 42px 70px;
    }

    /* BOAS-VINDAS */

    .boas-vindas {
      position: relative;
      min-height: 220px;

      display: flex;
      align-items: center;

      padding: 38px 42px;
      margin-bottom: 38px;

      overflow: hidden;

      border: 1px solid #39342a;
      border-radius: 15px;

      background:
        linear-gradient(
          90deg,
          rgba(10, 11, 12, 0.99) 0%,
          rgba(10, 11, 12, 0.95) 44%,
          rgba(10, 11, 12, 0.55) 100%
        ),
        radial-gradient(
          ellipse at 80% 40%,
          rgba(212, 175, 90, 0.14),
          transparent 55%
        ),
        #151515;
    }

    .boas-vindas::after {
      content: "";
      position: absolute;

      width: 240px;
      height: 240px;

      right: 45px;
      top: -20px;

      border: 1px solid rgba(212, 175, 90, 0.1);
      border-radius: 50%;

      box-shadow:
        0 0 0 25px rgba(212, 175, 90, 0.025),
        0 0 0 50px rgba(212, 175, 90, 0.02);

      pointer-events: none;
    }

    .conteudo-boas-vindas {
      position: relative;
      z-index: 1;
      max-width: 650px;
    }

    .subtitulo {
      color: var(--dourado);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .boas-vindas h1 {
      color: var(--dourado-claro);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 4vw, 49px);
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .boas-vindas p {
      color: #d0d0d0;
      font-size: 16px;
      line-height: 1.8;
      max-width: 560px;
    }

    .linha-dourada {
      display: block;
      width: 70px;
      height: 3px;

      margin-top: 24px;

      border-radius: 3px;
      background: var(--dourado);
    }

    /* PESQUISA */

    .area-pesquisa {
      margin-bottom: 42px;
    }

    .pesquisa {
      display: block;
      width: 100%;

      padding: 16px 19px;

      background: #17191b;
      border: 1px solid #3b3c3d;
      border-radius: 10px;

      color: var(--texto);
      font-size: 15px;

      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pesquisa::placeholder {
      color: #bcbfc4;
      opacity: 0.85;
    }

    .pesquisa:focus {
      border-color: var(--dourado);
      box-shadow: 0 0 0 3px rgba(212, 175, 90, 0.09);
    }

    /* TÍTULO DAS SEÇÕES */

    .cabecalho-secao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      margin-bottom: 23px;
    }

    .secao-titulo {
      color: var(--dourado-claro);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 29px;
      font-weight: bold;
    }

    .linha-secao {
      height: 1px;
      flex: 1;

      background: linear-gradient(
        90deg,
        rgba(212, 175, 90, 0.55),
        transparent
      );
    }

    /* LIVROS */

    .livros {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 23px;
    }

    .card {
      display: flex;
      flex-direction: column;

      min-width: 0;
      min-height: 405px;

      padding: 21px;

      background: linear-gradient(145deg, #181a1c, #121416);
      border: 1px solid #353637;
      border-radius: 13px;

      box-shadow: 0 9px 24px var(--sombra);

      transition:
        transform 0.22s ease,
        border-color 0.22s ease,
        box-shadow 0.22s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #71603c;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }

    .capa {
      width: 100%;
      height: 190px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 21px;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          rgba(212, 175, 90, 0.09),
          transparent 70%
        ),
        #101214;

      border: 1px solid #2c2d2e;
      border-radius: 9px;
    }

    .capa svg {
      width: 72px;
      height: 72px;

      fill: none;
      stroke: #a98a4a;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;

      opacity: 0.85;
    }

    .capa-principal {
      background:
        radial-gradient(
          ellipse at center,
          rgba(34, 52, 91, 0.4),
          transparent 75%
        ),
        #101522;
    }

    .capa-principal svg {
      stroke: #d4af5a;
    }

    .card h3 {
      color: #f2f2f2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .card p {
      color: var(--texto-secundario);
      font-size: 14px;
      line-height: 1.65;

      margin-bottom: 23px;
    }

    .botao {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 45px;

      margin-top: auto;
      padding: 11px 16px;

      border: 1px solid #514735;
      border-radius: 9px;

      background: #202124;
      color: var(--texto);

      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: bold;

      transition: 0.2s;
    }

    .botao:hover {
      border-color: var(--dourado);
      background: #29261f;
      color: var(--dourado-claro);
    }

    .botao-principal {
      color: #17140d;
      background: linear-gradient(
        110deg,
        #d4af5a,
        #f0cf83
      );

      border-color: var(--dourado);
    }

    .botao-principal:hover {
      color: #111;
      background: #f3d58d;
      border-color: #f3d58d;
    }

    .sem-resultados {
      color: var(--texto-secundario);
      padding: 25px 0;
      line-height: 1.7;
    }

    /* MENU DE ESCRITA */

    .menu-criar {
      position: fixed;
      right: 29px;
      bottom: 165px;

      width: 300px;
      max-width: calc(100vw - 34px);

      padding: 14px;

      background: #17191b;
      border: 1px solid #514735;
      border-radius: 13px;

      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.55);

      display: none;
      z-index: 12;
    }

    .menu-criar.aberto {
      display: block;
      animation: aparecer 0.18s ease;
    }

    .menu-criar h3 {
      color: var(--dourado-claro);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      padding: 10px 9px;
    }

    .menu-criar p {
      color: var(--texto-secundario);
      font-size: 13px;
      line-height: 1.6;
      padding: 0 9px 12px;
    }

    .menu-criar a {
      display: block;

      padding: 12px 10px;
      margin-top: 3px;

      border-radius: 8px;

      color: var(--texto);
      text-decoration: none;
      font-size: 14px;

      transition: 0.2s;
    }

    .menu-criar a:hover {
      background: #272522;
      color: var(--dourado-claro);
    }

    .menu-criar small {
      display: block;
      margin-top: 5px;

      color: #aeb0b5;
      font-size: 12px;
      line-height: 1.5;
    }

    /* BOTÕES FLUTUANTES */

    .botoes-flutuantes {
      position: fixed;
      right: 29px;
      bottom: 26px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;

      z-index: 11;
    }

    .botao-flutuante {
      width: 53px;
      height: 53px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid #514735;
      border-radius: 50%;

      background: #1d1f21;
      color: var(--dourado-claro);

      text-decoration: none;
      cursor: pointer;

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);

      transition:
        transform 0.2s,
        background 0.2s,
        border-color 0.2s;
    }

    .botao-flutuante:hover {
      transform: translateY(-3px);
      border-color: var(--dourado);
      background: #29261f;
    }

    .botao-flutuante svg {
      width: 23px;
      height: 23px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .botao-criar {
      width: 60px;
      height: 60px;

      background: linear-gradient(
        135deg,
        #f0cf83,
        #c69a3c
      );

      color: #17140d;
      border: 1px solid #e6c36e;

      font-size: 35px;
      font-weight: 300;
      line-height: 1;
    }

    .botao-criar:hover {
      background: #f3d58d;
      color: #111;
    }

    /* RODAPÉ */

    footer {
      min-height: 82px;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 35px;

      padding: 24px 20px;

      border-top: 1px solid #34312a;
      background: rgba(14, 15, 16, 0.8);

      color: var(--texto-secundario);
      font-size: 14px;
      text-align: center;
    }

    .texto-rodape {
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: bold;
    }

    .texto-rodape span {
      color: #ffffff;
    }

    footer a {
      color: var(--texto-secundario);
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--dourado-claro);
    }

    /* ANIMAÇÃO */

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* TABLETS */

    @media (max-width: 900px) {
      header {
        padding: 0 23px;
      }

      main {
        padding: 35px 25px 60px;
      }

      .boas-vindas {
        padding: 32px;
      }

      .livros {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        min-height: 390px;
      }

      .card:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }

      .card:last-child:nth-child(odd) .capa {
        max-width: 100%;
      }
    }

    /* CELULARES */

    @media (max-width: 600px) {
      header {
        height: 68px;
        padding: 0 13px;
        gap: 10px;
      }

      .lado-esquerdo {
        gap: 8px;
      }

      .botao-menu {
        width: 38px;
        height: 38px;
      }

      .icone-hamburguer span {
        width: 21px;
      }

      .logo {
        gap: 7px;
        font-size: 25px;
      }

      .logo img {
        width: 32px;
        height: 32px;
      }

      .link-livros {
        min-width: auto;
        padding: 10px 13px;
        font-size: 13px;
      }

      .estrutura {
        min-height: calc(100vh - 68px);
      }

      main {
        padding: 25px 16px 65px;
      }

      .boas-vindas {
        min-height: 210px;
        padding: 27px 22px;
        margin-bottom: 27px;
        border-radius: 12px;
      }

      .boas-vindas::after {
        width: 140px;
        height: 140px;
        right: -45px;
        top: 25px;
      }

      .subtitulo {
        font-size: 10px;
        letter-spacing: 1.7px;
        margin-bottom: 12px;
      }

      .boas-vindas h1 {
        font-size: 33px;
        margin-bottom: 12px;
      }

      .boas-vindas p {
        font-size: 14px;
        line-height: 1.7;
      }

      .linha-dourada {
        width: 55px;
        margin-top: 18px;
      }

      .area-pesquisa {
        margin-bottom: 32px;
      }

      .pesquisa {
        padding: 14px;
        font-size: 14px;
      }

      .cabecalho-secao {
        gap: 12px;
        margin-bottom: 18px;
      }

      .secao-titulo {
        font-size: 24px;
      }

      .livros {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .card,
      .card:last-child:nth-child(odd) {
        grid-column: auto;
        min-height: 0;
        padding: 17px;
      }

      .capa {
        height: 175px;
        margin-bottom: 17px;
      }

      .card h3 {
        font-size: 20px;
      }

      .card p {
        margin-bottom: 19px;
      }

      .botao {
        min-height: 44px;
      }

      .botoes-flutuantes {
        right: 15px;
        bottom: 17px;
        gap: 10px;
      }

      .botao-flutuante {
        width: 47px;
        height: 47px;
      }

      .botao-criar {
        width: 55px;
        height: 55px;
        font-size: 32px;
      }

      .menu-criar {
        right: 14px;
        bottom: 143px;
        width: 290px;
      }

      footer {
        gap: 14px;
        min-height: 75px;
        padding: 22px 15px;
        font-size: 13px;
      }

      .texto-rodape {
        font-size: 17px;
      }
    }

    /* CELULARES MUITO PEQUENOS */

    @media (max-width: 360px) {
      .logo {
        font-size: 22px;
      }

      .logo img {
        width: 28px;
        height: 28px;
      }

      .lado-esquerdo {
        gap: 4px;
      }

      .link-livros {
        padding: 9px;
      }

      .boas-vindas h1 {
        font-size: 29px;
      }

      .secao-titulo {
        font-size: 21px;
      }
    }

    /* ACESSIBILIDADE: REDUZIR ANIMAÇÕES */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- CABEÇALHO -->

  <header>
    <div class="lado-esquerdo">

      <button
        class="botao-menu"
        id="botaoMenu"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="menuLateral"
      >
        <span class="icone-hamburguer" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <a class="logo" href="home.html" aria-label="Mystic — Início">
        <img src="logo-mystic
