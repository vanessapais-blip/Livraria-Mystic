<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystic - Livraria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #242424;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        /* CABEÇALHO */

        header {
            height: 75px;
            background: #303030;
            border-bottom: 1px solid #444444;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 500;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #bbbbbb;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        /* CONTEÚDO */

        main {
            max-width: 1100px;
            margin: auto;
            padding: 50px 25px;
        }

        .boas-vindas h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .boas-vindas p {
            color: #999999;
            font-size: 17px;
        }

        /* PESQUISA */

        .pesquisa {
            width: 100%;
            margin-top: 35px;
            margin-bottom: 45px;

            padding: 15px;

            background: #303030;
            color: white;

            border: 1px solid #444444;
            border-radius: 9px;

            font-size: 15px;
        }

        .pesquisa:focus {
            outline: none;
            border-color: #777777;
        }

        /* LIVROS */

        .titulo {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .livros {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 25px;
        }

        .livro {
            background: #303030;

            border: 1px solid #404040;
            border-radius: 12px;

            padding: 15px;

            transition: 0.2s;
        }

        .livro:hover {
            transform: translateY(-4px);
            border-color: #666666;
        }

        .capa {
            height: 240px;

            background: #3b3b3b;

            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;

            margin-bottom: 15px;
        }

        .livro h3 {
            margin-bottom: 7px;
        }

        .livro p {
            color: #999999;
            font-size: 14px;
        }

        .botao {
            display: block;

            margin-top: 15px;
            padding: 10px;

            background: #eeeeee;
            color: #222222;

            text-align: center;

            border-radius: 7px;

            text-decoration: none;
        }

        .botao:hover {
            background: #cccccc;
        }

        /* RODAPÉ */

        footer {
            text-align: center;

            padding: 40px;

            color: #777777;
        }
    </style>
</head>


<body>

    <header>

        <div class="logo">
            Mystic
        </div>


        <nav>

            <a href="home.html">
                Início
            </a>

            <a href="#">
                Livros
            </a>

            <a href="#">
                Blogs
            </a>

            <a href="#">
                Redações
            </a>

        </nav>

    </header>


    <main>

        <section class="boas-vindas">

            <h1>
                Bem-vindo à Mystic
            </h1>

            <p>
                Encontre livros, histórias, redações e muito mais.
            </p>

        </section>


        <input
            class="pesquisa"
            type="text"
            placeholder="🔍 Pesquisar livros..."
        >


        <h2 class="titulo">
            Livros em destaque
        </h2>


        <section class="livros">


            <!-- LIVRO 1 -->

            <article class="livro">

                <div class="capa">
                    📕
                </div>

                <h3>
                    O Pequeno Príncipe
                </h3>

                <p>
                    Antoine de Saint-Exupéry
                </p>

                <a
                    href="livro.html"
                    class="botao"
                >
                    Ver livro
                </a>

            </article>


            <!-- LIVRO 2 -->

            <article class="livro">

                <div class="capa">
                    📘
                </div>

                <h3>
                    Em breve
                </h3>

                <p>
                    Novo livro
                </p>

                <a href="#" class="botao">
                    Em breve
                </a>

            </article>


            <!-- LIVRO 3 -->

            <article class="livro">

                <div class="capa">
                    📗
                </div>

                <h3>
                    Em breve
                </h3>

                <p>
                    Novo livro
                </p>

                <a href="#" class="botao">
                    Em breve
                </a>

            </article>


        </section>

    </main>


    <footer>

        Mystic — Livraria

    </footer>

</body>

</html>
