<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>Login | Livraria Mystic</title>

  <style>
    :root {
      --fundo: #090909;
      --cartao: #151515;
      --dourado: #d4af67;
      --dourado-claro: #f0d99b;
      --texto: #f5f0e6;
      --texto-suave: #aaa49a;
      --borda: #3a3124;
      --erro: #ff8888;
      --sucesso: #9ce3aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(
        ellipse at top,
        #292114 0,
        #111 42%,
        var(--fundo) 78%
      );
      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: rgba(21, 21, 21, 0.97);
      border: 1px solid var(--borda);
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.6);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      display: block;
      width: 140px;
      height: 140px;
      max-width: 70%;
      object-fit: cover;
      margin: 0 auto 14px;
      border: 2px solid var(--dourado);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(212, 175, 103, 0.15);
    }

    .marca {
      color: var(--dourado);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitulo {
      margin-top: 9px;
      color: var(--texto-suave);
      font-size: 13px;
    }

    h1 {
      margin-bottom: 8px;
      color: var(--dourado-claro);
      font-size: 24px;
      text-align: center;
    }

    .descricao {
      margin-bottom: 24px;
      color: var(--texto-suave);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .campo {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      background: #0c0c0c;
      border: 1px solid #484033;
      border-radius: 9px;
      color: var(--texto);
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--dourado);
      box-shadow: 0 0 0 3px rgba(212, 175, 103, 0.12);
    }

    input::placeholder {
      color: #77716a;
    }

    .senha-wrapper {
      position: relative;
    }

    .senha-wrapper input {
      padding-right: 78px;
    }

    .mostrar-senha {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--dourado);
      font-size: 12px;
      cursor: pointer;
    }

    .opcoes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 20px;
    }

    .lembrar {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--texto-suave);
      font-size: 12px;
      font-weight: normal;
      cursor: pointer;
    }

    .lembrar input {
      accent-color: var(--dourado);
    }

    a {
      color: var(--dourado);
      text-decoration: none;
    }

    a:hover {
      color: var(--dourado-claro);
      text-decoration: underline;
    }

    .esqueci {
      font-size: 12px;
    }

    .captcha {
      margin-bottom: 19px;
      padding: 14px;
      background: #101010;
      border: 1px solid var(--borda);
      border-radius: 10px;
    }

    .captcha-titulo {
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .captcha-linha {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .captcha-linha span {
      flex-shrink: 0;
      color: var(--dourado-claro);
      font-size: 14px;
      font-weight: bold;
    }

    .captcha-linha input {
      flex: 1;
      width: 100%;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(
        135deg,
        var(--dourado-claro),
        var(--dourado)
      );
      border: none;
      border-radius: 9px;
      color: #17130b;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: filter 0.2s;
    }

    .botao:hover {
      filter: brightness(1.08);
    }

    .botao:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .mensagem {
      display: none;
      margin-bottom: 17px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .mensagem.erro {
      display: block;
      color: var(--erro);
      background: rgba(255, 119, 119, 0.06);
      border: 1px solid rgba(255, 119, 119, 0.25);
    }

    .mensagem.sucesso {
      display: block;
      color: var(--sucesso);
      background: rgba(139, 224, 160, 0.06);
      border: 1px solid rgba(139, 224, 160, 0.25);
    }

    .cadastro {
      margin-top: 23px;
      padding-top: 19px;
      border-top: 1px solid var(--borda);
      color: var(--texto-suave);
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
    }

    .cadastro a {
      display: inline-block;
      padding: 5px 12px;
      margin-top: 5px;
      border: 1px solid var(--dourado);
      border-radius: 7px;
      font-weight: bold;
      transition: background 0.2s, color 0.2s;
    }

    .cadastro a:hover {
      background: var(--dourado);
      color: #111;
      text-decoration: none;
    }

    .rodape {
      margin-top: 20px;
      color: #77716a;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 25px 21px;
      }

      .marca {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="logo-area">
      <img
        class="logo"
        src="logo-mystic.jpg"
        alt="Logo da Livraria Mystic"
        onerror="this.style.display='none'"
      >

      <div class="marca">LIVRARIA MYSTIC</div>

      <p class="subtitulo">
        Um universo de histórias espera por você.
      </p>
    </header>

    <h1>Bem-vindo de volta</h1>

    <p class="descricao">
      Entre na sua conta para continuar sua jornada literária.
    </p>

    <div
      id="mensagem"
      class="mensagem"
      role="status"
      aria-live="polite"
    ></div>

    <form id="formLogin">

      <div class="campo">
        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >
      </div>

      <div class="campo">
        <label for="senha">Senha</label>

        <div class="senha-wrapper">
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button
            class="mostrar-senha"
            type="button"
            id="toggleSenha"
          >
            Mostrar
          </button>
        </div>
      </div>

      <div class="opcoes">

        <label class="lembrar" for="lembrar">
          <input type="checkbox" id="lembrar">
          Lembrar meu e-mail
        </label>

        <a href="#" class="esqueci" id="esqueciSenha">
          Esqueci a senha
        </a>

      </div>

      <div class="captcha">
        <p class="captcha-titulo">
          Verificação de segurança
        </p>

        <div class="captcha-linha">
          <span id="perguntaCaptcha"></span>

          <input
            type="text"
            id="respostaCaptcha"
            inputmode="numeric"
            autocomplete="off"
            placeholder="Resposta"
            aria-label="Resposta da verificação"
            required
          >
        </div>
      </div>

      <button class="botao" id="botaoEntrar" type="submit">
        Entrar na minha conta
      </button>

    </form>

    <div class="cadastro">
      Ainda não tem uma conta?<br>

      <!-- ESTE LINK ABRE A PÁGINA DE CADASTRO -->
      <a href="cadastro.html">
        Criar minha conta
      </a>
    </div>

    <footer class="rodape">
      © <span id="ano"></span> Livraria Mystic.<br>
      Sua próxima história começa aqui.
    </footer>

  </main>

  <script>
    "use strict";

    const CHAVE_CONTAS = "mysticContas";
    const CHAVE_LEMBRADAS = "mysticContasLembradas";
    const CHAVE_SESSAO = "mysticSessao";

    const formulario = document.getElementById("formLogin");
    const campoEmail = document.getElementById("email");
    const campoSenha = document.getElementById("senha");
    const campoCaptcha = document.getElementById("respostaCaptcha");
    const checkboxLembrar = document.getElementById("lembrar");
    const mensagem = document.getElementById("mensagem");
    const botaoEntrar = document.getElementById("botaoEntrar");

    let numero1;
    let numero2;
    let tentativaEmAndamento = false;

    document.getElementById("ano").textContent =
      new Date().getFullYear();

    function lerJSON(chave, valorPadrao) {
      try {
        const valor = localStorage.getItem(chave);
        return valor ? JSON.parse(valor) : valorPadrao;
      } catch {
        return valorPadrao;
      }
    }

    function mostrarMensagem(texto, tipo = "erro") {
      mensagem.textContent = texto;
      mensagem.className = "mensagem " + tipo;
    }

    function limparMensagem() {
      mensagem.textContent = "";
      mensagem.className = "mensagem";
    }

    function gerarCaptcha() {
      numero1 = Math.floor(Math.random() * 9) + 1;
      numero2 = Math.floor(Math.random() * 9) + 1;

      document.getElementById("perguntaCaptcha").textContent =
        `Quanto é ${numero1} + ${numero2}?`;

      campoCaptcha.value = "";
    }

    function obterCampo(conta, nomes) {
      for (const nome of nomes) {
        if (
          conta &&
          Object.prototype.hasOwnProperty.call(conta, nome)
        ) {
          return conta[nome];
        }
      }

      return undefined;
    }

    function base64ParaBytes(valor) {
      const binario = atob(valor);

      return Uint8Array.from(
        binario,
        caractere => caractere.charCodeAt(0)
      );
    }

    function bytesParaBase64(bytes) {
      let binario = "";

      bytes.forEach(byte => {
        binario += String.fromCharCode(byte);
      });

      return btoa(binario);
    }

    async function calcularHash(senha, salt, iteracoes) {
      if (!window.crypto || !window.crypto.subtle) {
        throw new Error("CRIPTOGRAFIA_INDISPONIVEL");
      }

      const chave = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(senha),
        "PBKDF2",
        false,
        ["deriveBits"]
      );

      const resultado = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2",
          salt: base64ParaBytes(salt),
          iterations: iteracoes,
          hash: "SHA-256"
        },
        chave,
        256
      );

      return bytesParaBase64(new Uint8Array(resultado));
    }

    async function verificarSenha(conta, senhaDigitada) {
      const senhaSalva = obterCampo(
        conta,
        ["senhaHash", "passwordHash", "hash", "senha", "password"]
      );

      const salt = obterCampo(
        conta,
        ["salt", "senhaSalt", "passwordSalt"]
      );

      if (typeof senhaSalva !== "string") {
        return false;
      }

      if (salt) {
        const iteracoes =
          Number(obterCampo(conta, ["iteracoes", "iterations"])) ||
          210000;

        try {
          const hash = await calcularHash(
            senhaDigitada,
            salt,
            iteracoes
          );

          return hash === senhaSalva;
        } catch (erro) {
          if (erro.message === "CRIPTOGRAFIA_INDISPONIVEL") {
            throw erro;
          }

          return false;
        }
      }

      // Compatibilidade com cadastros antigos que salvaram senha em texto.
      return senhaSalva === senhaDigitada;
    }

    function procurarConta(email) {
      const contas = lerJSON(CHAVE_CONTAS, []);

      if (!Array.isArray(contas)) {
        return null;
      }

      return contas.find(conta => {
        const emailSalvo = obterCampo(
          conta,
          ["email", "e-mail", "usuario", "user"]
        );

        return (
          typeof emailSalvo === "string" &&
          emailSalvo.trim().toLowerCase() === email
        );
      }) || null;
    }

    function carregarEmailLembrado() {
      const salvo = lerJSON(CHAVE_LEMBRADAS, null);

      if (typeof salvo === "string") {
        campoEmail.value = salvo;
        checkboxLembrar.checked = true;
      } else if (salvo && typeof salvo.email === "string") {
        campoEmail.value = salvo.email;
        checkboxLembrar.checked = true;
      }
    }

    function salvarEmailLembrado(email) {
      if (checkboxLembrar.checked) {
        localStorage.setItem(
          CHAVE_LEMBRADAS,
          JSON.stringify({ email: email })
        );
      } else {
        localStorage.removeItem(CHAVE_LEMBRADAS);
      }
    }

    document
      .getElementById("toggleSenha")
      .addEventListener("click", function () {
        const visivel = campoSenha.type === "text";

        campoSenha.type = visivel ? "password" : "text";
        this.textContent = visivel ? "Mostrar" : "Ocultar";
      });

    document
      .getElementById("esqueciSenha")
      .addEventListener("click", function (evento) {
        evento.preventDefault();

        mostrarMensagem(
          "A recuperação de senha ainda não está configurada. " +
          "Entre em contato com o responsável pelo site para obter ajuda."
        );
      });

    formulario.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      if (tentativaEmAndamento) {
        return;
      }

      limparMensagem();

      const email = campoEmail.value.trim().toLowerCase();
      const senha = campoSenha.value;
      const resposta = campoCaptcha.value.trim();

      if (
        !/^\d+$/.test(resposta) ||
        Number(resposta) !== numero1 + numero2
      ) {
        mostrarMensagem(
          "A resposta da verificação está incorreta. Tente novamente."
        );

        gerarCaptcha();
        return;
      }

      tentativaEmAndamento = true;
      botaoEntrar.disabled = true;
      botaoEntrar.textContent = "Verificando...";

      try {
        const conta = procurarConta(email);

        if (!conta) {
          mostrarMensagem(
            "E-mail ou senha incorretos. Confira os dados ou crie uma conta."
          );

          gerarCaptcha();
          return;
        }

        const senhaCorreta = await verificarSenha(conta, senha);

        if (!senhaCorreta) {
          mostrarMensagem(
            "E-mail ou senha incorretos. Confira os dados e tente novamente."
          );

          gerarCaptcha();
          return;
        }

        salvarEmailLembrado(email);

        const sessao = {
          email: email,
          nome: obterCampo(conta, ["nome", "name"]) || "",
          autenticado: true,
          dataLogin: new Date().toISOString()
        };

        localStorage.setItem(
          CHAVE_SESSAO,
          JSON.stringify(sessao)
        );

        mostrarMensagem(
          "Login realizado com sucesso! Redirecionando...",
          "sucesso"
        );

        window.location.href = "home.html";

      } catch (erro) {
        console.error("Erro durante o login:", erro);

        if (erro.message === "CRIPTOGRAFIA_INDISPONIVEL") {
          mostrarMensagem(
            "Para verificar as senhas, abra o projeto usando HTTPS " +
            "ou um servidor local, como o Live Server do VS Code."
          );
        } else {
          mostrarMensagem(
            "Não foi possível verificar seus dados. Tente novamente."
          );
        }
      } finally {
        tentativaEmAndamento = false;
        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar na minha conta";
      }
    });

    // Informa quando o cadastro foi concluído.
    const parametros = new URLSearchParams(window.location.search);

    if (parametros.get("cadastro") === "sucesso") {
      mostrarMensagem(
        "Cadastro realizado com sucesso! Agora você pode entrar.",
        "sucesso"
      );

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    carregarEmailLembrado();
    gerarCaptcha();
  </script>

</body>
</html>
