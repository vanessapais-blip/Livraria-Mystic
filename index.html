<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystic - Livraria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #242424;
            color: #eeeeee;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            width: 90%;
            max-width: 400px;
            padding: 40px;

            background: #303030;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .logo p {
            color: #999999;
            margin-top: 5px;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cccccc;
        }

        input {
            width: 100%;
            padding: 13px;

            background: #222222;
            color: white;

            border: 1px solid #4a4a4a;
            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #888888;
        }

        .entrar {
            display: block;
            width: 100%;

            padding: 14px;

            background: #eeeeee;
            color: #222222;

            border-radius: 8px;

            text-align: center;
            text-decoration: none;

            font-weight: bold;

            margin-top: 25px;
        }

        .entrar:hover {
            background: #cccccc;
        }

        .cadastro {
            text-align: center;
            margin-top: 22px;

            color: #999999;
            font-size: 14px;
        }

        .cadastro a {
            color: #eeeeee;
            text-decoration: none;
        }
    </style>
</head>


<body>

    <div class="login">

        <div class="logo">
            <h1>Mystic</h1>
            <p>Livraria</p>
        </div>


        <h2>Entrar</h2>


        <div class="campo">
            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
            >
        </div>


        <div class="campo">
            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >
        </div>


        <a href="home.html" class="entrar">
            Entrar
        </a>


        <div class="cadastro">
            Ainda não possui uma conta?

            <a href="#">
                Criar conta
            </a>
        </div>

    </div>

</body>

</html>
