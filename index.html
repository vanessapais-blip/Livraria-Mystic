<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mystic - Livraria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #252525;
            color: #eeeeee;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login {
            width: 90%;
            max-width: 400px;
            background: #303030;
            padding: 40px;
            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 42px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .logo p {
            margin-top: 5px;
            color: #aaaaaa;
            font-size: 15px;
        }

        .login h2 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            margin-bottom: 7px;
            color: #cccccc;
        }

        .campo input {
            width: 100%;
            padding: 13px;
            border: 1px solid #555555;
            border-radius: 8px;

            background: #222222;
            color: white;

            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #888888;
        }

        .entrar {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #eeeeee;
            color: #222222;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .entrar:hover {
            background: #cccccc;
        }

        .cadastro {
            text-align: center;
            margin-top: 22px;
            color: #999999;
            font-size: 14px;
        }

        .cadastro a {
            color: #eeeeee;
            text-decoration: none;
        }

        .cadastro a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="logo">
            <h1>Myst
