<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic — Entrar</title>

  <style>
    :root {
      /* Paleta original preservada */
      --fundo: #000000;
      --cartao: #303030;
      --texto: #eeeeee;
      --dourado: #d4af37;
      --borda: #555555;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fundo);
      color: var(--dourado);
      font-family: Arial, Helvetica, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 390px;
      padding: 30px;
      background: var(--cartao);
      border-radius: 12px;
      border: 1px solid var(--borda);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo img {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 12px;
    }

    .logo h1 {
      margin: 0;
      color: #ffffff;
      font-size: 32px;
      letter-spacing: 3px;
    }

    .logo p {
      color: var(--dourado);
      margin-bottom: 0;
    }

    h2 {
      color: var(--dourado);
      text-align: center;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: var(--dourado);
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      background: #222222;
      color: var(--texto);
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid var(--dourado);
      outline-offset: 2px;
    }

    .opcao {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 16px;
      color: var(--dourado);
      font-size: 14px;
    }

    .opcao label {
      margin: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: var(--dourado);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .botao {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 1px solid var(--dourado);
      border-radius: 6px;
      background: #222222;
      color: var(--dourado);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .botao:hover {
      background: #3a3a3a;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: var(--dourado);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .mensagem {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
    }

    .oculto {
      display: none;
    }

    .aviso {
      margin-top: 18px;
      color: var(--texto);
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login">
    <header class="logo">
      <img src="logo-mystic.jpg" alt="Logo da Mystic"
           onerror="this.style.display='none'">
      <h1>Mystic</h1>
      <p>Sua biblioteca começa aqui.</p>
    </header>

    <section id="areaLogin">
      <h2>Entrar</h2>

      <form id="formLogin">
        <label for="emailLogin">E-mail</label>
        <input
          type="email"
          id="emailLogin"
          autocomplete="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senhaLogin">Senha</label>
        <input
          type="password"
          id="senhaLogin"
          autocomplete="current-password"
          placeholder="Digite sua senha"
          required
        >

        <div class="opcao">
          <input type="checkbox" id="lembrar">
          <label for="lembrar">Lembrar de mim</label>
        </div>

        <div class="opcao">
          <input type="checkbox" id="naoSouRobo" required>
          <label for="naoSouRobo">Não sou um robô</label>
        </div>

        <button class="botao" type="submit">Entrar</button>
        <p id="mensagemLogin" class="mensagem" role="status"></p>
      </form>

      <div class="links">
        <a href="#" id="abrirCadastro">Criar uma conta</a>
        <br>
        <a href="#" id="esqueciSenha">Esqueci minha senha</a>
      </div>
    </section>

    <section id="areaCadastro" class="oculto">
      <h2>Criar conta</h2>

      <form id="formCadastro">
        <label for="emailCadastro">E-mail</label>
        <input
          type="email"
          id="emailCadastro"
          autocomplete="email"
          placeholder="Digite seu e-mail"
          required
        >

        <label for="senhaCadastro">Criar senha</label>
        <input
          type="password"
          id="senhaCadastro"
          autocomplete="new-password"
          minlength="6"
          placeholder="Mínimo de 6 caracteres"
          required
        >

        <label for="confirmarSenha">Confirmar senha</label>
        <input
          type="password"
          id="confirmarSenha"
          autocomplete="new-password"
          placeholder="Digite a senha novamente"
          required
        >

        <button class="botao" type="submit">Criar conta</button>
        <p id="mensagemCadastro" class="mensagem" role="status"></p>
      </form>

      <div class="links">
        <a href="#" id="voltarLogin">Voltar para entrar</a>
      </div>
    </section>

    <p class="aviso">
      Demonstração local: este sistema ainda não possui autenticação
      segura nem verificação profissional contra robôs.
    </p>
  </main>

  <script>
    const CHAVE_CONTAS = "mysticContas";
    const CHAVE_SESSAO = "mysticSessao";
    const CHAVE_LEMBRAR = "mysticLembrar";

    function obterContas() {
      try {
        const contas = JSON.parse(
          localStorage.getItem(CHAVE_CONTAS) || "{}"
        );

        return contas && typeof contas === "object" ? contas : {};
      } catch {
        return {};
      }
    }

    function mostrarMensagem(id, texto) {
      document.getElementById(id).textContent = texto;
    }

    function emailNormalizado(email) {
      return email.trim().toLowerCase();
    }

    function abrirLogin() {
      document.getElementById("areaLogin").classList.remove("oculto");
      document.getElementById("areaCadastro").classList.add("oculto");
    }

    function abrirCadastro() {
      document.getElementById("areaLogin").classList.add("oculto");
      document.getElementById("areaCadastro").classList.remove("oculto");
    }

    document.getElementById("abrirCadastro").addEventListener("click", (e) => {
      e.preventDefault();
      abrirCadastro();
    });

    document.getElementById("voltarLogin").addEventListener("click", (e) => {
      e.preventDefault();
      abrirLogin();
    });

    document.getElementById("formCadastro").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = emailNormalizado(
        document.getElementById("emailCadastro").value
      );
      const senha = document.getElementById("senhaCadastro").value;
      const confirmar = document.getElementById("confirmarSenha").value;
      const contas = obterContas();

      if (senha.length < 6) {
        mostrarMensagem(
          "mensagemCadastro",
          "A senha precisa ter pelo menos 6 caracteres."
        );
        return;
      }

      if (senha !== confirmar) {
        mostrarMensagem("mensagemCadastro", "As senhas não coincidem.");
        return;
      }

      if (contas[email]) {
        mostrarMensagem(
          "mensagemCadastro",
          "Já existe uma conta cadastrada com esse e-mail."
        );
        return;
      }

      /*
       * ATENÇÃO: armazenamento local apenas para demonstração.
       * Não use este método para contas reais.
       */
      contas[email] = { senha: senha };

      try {
        localStorage.setItem(CHAVE_CONTAS, JSON.stringify(contas));
      } catch {
        mostrarMensagem(
          "mensagemCadastro",
          "Não foi possível salvar a conta neste navegador."
        );
        return;
      }

      document.getElementById("formCadastro").reset();
      mostrarMensagem(
        "mensagemCadastro",
        "Conta criada. Agora você pode entrar."
      );
    });

    document.getElementById("formLogin").addEventListener("submit", (e) => {
      e.preventDefault();

      const email = emailNormalizado(
        document.getElementById("emailLogin").value
      );
      const senha = document.getElementById("senhaLogin").value;
      const lembrar = document.getElementById("lembrar").checked;
      const verificado = document.getElementById("naoSouRobo").checked;
      const contas = obterContas();

      if (!verificado) {
        mostrarMensagem(
          "mensagemLogin",
          "Marque a caixa de verificação para continuar."
        );
        return;
      }

      if (!contas[email] || contas[email].senha !== senha) {
        mostrarMensagem(
          "mensagemLogin",
          "E-mail ou senha incorretos."
        );
        return;
      }

      const dadosSessao = JSON.stringify({
        email: email,
        autenticado: true
      });

      try {
        if (lembrar) {
          localStorage.setItem(CHAVE_LEMBRAR, dadosSessao);
          sessionStorage.removeItem(CHAVE_SESSAO);
        } else {
          sessionStorage.setItem(CHAVE_SESSAO, dadosSessao);
          localStorage.removeItem(CHAVE_LEMBRAR);
        }
      } catch {
        mostrarMensagem(
          "mensagemLogin",
          "Não foi possível salvar a sessão."
        );
        return;
      }

      mostrarMensagem("mensagemLogin", "Login realizado. Abrindo a Mystic...");

      window.location.href = "home.html";
    });

    document.getElementById("esqueciSenha").addEventListener("click", (e) => {
      e.preventDefault();

      alert(
        "A recuperação de senha ainda não está disponível. " +
        "Ela precisará de um serviço seguro de autenticação e e-mail."
      );
    });

    /*
     * A sessão pode ser consultada por outros arquivos HTML
     * do mesmo site e da mesma origem.
     */
    function obterSessaoMystic() {
      try {
        const lembrada = localStorage.getItem(CHAVE_LEMBRAR);
        const temporaria = sessionStorage.getItem(CHAVE_SESSAO);
        const dados = lembrada || temporaria;

        return dados ? JSON.parse(dados) : null;
      } catch {
        return null;
      }
    }

    // Expõe uma função para o próximo arquivo da Mystic.
    window.obterSessaoMystic = obterSessaoMystic;

    // Preenche o e-mail quando a opção "Lembrar de mim" estiver ativa.
    try {
      const sessao = localStorage.getItem(CHAVE_LEMBRAR);

      if (sessao) {
        const dados = JSON.parse(sessao);

        if (dados && dados.email) {
          document.getElementById("emailLogin").value = dados.email;
          document.getElementById("lembrar").checked = true;
        }
      }
    } catch {
      localStorage.removeItem(CHAVE_LEMBRAR);
    }
  </script>
</body>
</html>
