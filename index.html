<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      color: #d4af37;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 350px;
      padding: 25px;
      box-sizing: border-box;
      background: #303030;
      border-radius: 10px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      max-width: 120px;
      max-height: 120px;
      object-fit: contain;
    }

    .logo h2 {
      color: #d4af37;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: normal;
      text-align: center;
      margin-top: 10px;
    }

    h3 {
      color: #d4af37;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: normal;
      text-align: left;
      margin: 0 0 12px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: #d4af37;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #555555;
      border-radius: 5px;
      background: #222222;
      color: #eeeeee;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    input:focus {
      outline: 1px solid #d4af37;
    }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 18px;
      border: none;
      border-radius: 5px;
      background: #d4af37;
      color: #000000;
      font-family: Arial, sans-serif;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #c19b2e;
    }

    a {
      color: #d4af37;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .links {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    .opcao {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: #d4af37;
      font-size: 14px;
    }

    .opcao label {
      margin: 0;
      cursor: pointer;
    }

    input[type="checkbox"] {
      accent-color: #d4af37;
    }

    .captcha {
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #555555;
      border-radius: 5px;
      background: #272727;
    }

    .captcha-titulo {
      margin: 0 0 10px;
      font-size: 13px;
      color: #d4af37;
    }

    .captcha-desafio {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #codigoCaptcha {
      flex: 1;
      padding: 10px 5px;
      background: #383838;
      border-radius: 4px;
      color: #d4af37;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 4px;
      user-select: none;
    }

    .botao-atualizar {
      width: auto;
      margin: 0;
      padding: 9px 11px;
      font-size: 13px;
    }

    .mensagem {
      color: #d4af37;
      text-align: center;
      font-size: 13px;
    }

    .oculto {
      display: none;
    }

    .aviso {
      color: #eeeeee;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="login">

    <header class="logo">
      <img
        src="logo-mystic.jpg"
        alt="Logo da livraria"
        onerror="this.style.display='none'"
      >
      <h2>Livraria</h2>
    </header>

    <section id="areaLogin">
      <h3>Entrar</h3>

      <form id="formLogin">
        <label for="emailLogin">E-mail</label>
        <input
          type="email"
          id="emailLogin"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="senhaLogin">Senha</label>
        <input
          type="password"
          id="senhaLogin"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <div class="opcao">
          <input type="checkbox" id="lembrar">
          <label for="lembrar">Lembrar de mim</label>
        </div>

        <div class="captcha">
          <p class="captcha-titulo">Verificação de segurança</p>

          <div class="captcha-desafio">
            <span
              id="codigoCaptcha"
              aria-label="Código de verificação"
            ></span>

            <button
              type="button"
              class="botao-atualizar"
              id="atualizarCaptcha"
              aria-label="Gerar novo código"
            >↻ Novo</button>
          </div>

          <label for="respostaCaptcha">Digite o código exibido</label>
          <input
            type="text"
            id="respostaCaptcha"
            placeholder="Código de verificação"
            autocomplete="off"
            required
          >
        </div>

        <button type="submit">Entrar</button>
        <p id="mensagemLogin" class="mensagem" role="status"></p>
      </form>

      <div class="links">
        <a href="#" id="abrirCadastro">Criar uma conta</a>
        <br>
        <a href="#" id="esqueciSenha">Esqueci minha senha</a>
      </div>
    </section>

    <section id="areaCadastro" class="oculto">
      <h3>Criar conta</h3>

      <form id="formCadastro">
        <label for="emailCadastro">E-mail</label>
        <input
          type="email"
          id="emailCadastro"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="senhaCadastro">Senha</label>
        <input
          type="password"
          id="senhaCadastro"
          placeholder="Mínimo de 6 caracteres"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="confirmarSenha">Confirmar senha</label>
        <input
          type="password"
          id="confirmarSenha"
          placeholder="Digite a senha novamente"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button type="submit">Cadastrar</button>
        <p id="mensagemCadastro" class="mensagem" role="status"></p>
      </form>

      <div class="links">
        <a href="#" id="voltarLogin">Voltar para entrar</a>
      </div>
    </section>

    <p class="aviso">
      Versão de demonstração local.
    </p>

  </main>

  <script>
    const CHAVE_CONTAS = "mysticContas";
    const CHAVE_SESSAO = "mysticSessao";
    const CHAVE_LEMBRAR = "mysticLembrar";

    let codigoAtual = "";

    function obterContas() {
      try {
        const dados = JSON.parse(
          localStorage.getItem(CHAVE_CONTAS) || "{}"
        );

        return dados && typeof dados === "object" ? dados : {};
      } catch {
        return {};
      }
    }

    function gerarCaptcha() {
      const caracteres = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      codigoAtual = "";

      for (let i = 0; i < 6; i++) {
        codigoAtual += caracteres[
          Math.floor(Math.random() * caracteres.length)
        ];
      }

      document.getElementById("codigoCaptcha").textContent = codigoAtual;
      document.getElementById("respostaCaptcha").value = "";
    }

    gerarCaptcha();

    document
      .getElementById("atualizarCaptcha")
      .addEventListener("click", gerarCaptcha);

    document
      .getElementById("abrirCadastro")
      .addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("areaLogin").classList.add("oculto");
        document.getElementById("areaCadastro").classList.remove("oculto");
      });

    document
      .getElementById("voltarLogin")
      .addEventListener("click", function (e) {
        e.preventDefault();
        document.getElementById("areaCadastro").classList.add("oculto");
        document.getElementById("areaLogin").classList.remove("oculto");
      });

    document
      .getElementById("formCadastro")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        const email = document
          .getElementById("emailCadastro")
          .value.trim().toLowerCase();

        const senha = document.getElementById("senhaCadastro").value;
        const confirmar = document.getElementById("confirmarSenha").value;
        const mensagem = document.getElementById("mensagemCadastro");
        const contas = obterContas();

        if (senha.length < 6) {
          mensagem.textContent =
            "A senha precisa ter pelo menos 6 caracteres.";
          return;
        }

        if (senha !== confirmar) {
          mensagem.textContent = "As senhas não coincidem.";
          return;
        }

        if (contas[email]) {
          mensagem.textContent = "Este e-mail já está cadastrado.";
          return;
        }

        /*
         * Demonstração local apenas.
         * Não armazenar senhas assim em um site real.
         */
        contas[email] = { senha: senha };

        try {
          localStorage.setItem(CHAVE_CONTAS, JSON.stringify(contas));
          mensagem.textContent = "Conta criada. Você já pode entrar.";
          document.getElementById("formCadastro").reset();
        } catch {
          mensagem.textContent = "Não foi possível salvar a conta.";
        }
      });

    document
      .getElementById("formLogin")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        const mensagem = document.getElementById("mensagemLogin");
        const email = document
          .getElementById("emailLogin")
          .value.trim().toLowerCase();

        const senha = document.getElementById("senhaLogin").value;
        const resposta = document
          .getElementById("respostaCaptcha")
          .value.trim().toUpperCase();

        const lembrar = document.getElementById("lembrar").checked;

        if (resposta !== codigoAtual) {
          mensagem.textContent =
            "Código incorreto. Um novo código foi gerado.";
          gerarCaptcha();
          return;
        }

        const contas = obterContas();

        if (!contas[email] || contas[email].senha !== senha) {
          mensagem.textContent = "E-mail ou senha incorretos.";
          gerarCaptcha();
          return;
        }

        const sessao = JSON.stringify({
          email: email,
          autenticado: true
        });

        try {
          if (lembrar) {
            localStorage.setItem(CHAVE_LEMBRAR, sessao);
            sessionStorage.removeItem(CHAVE_SESSAO);
          } else {
            sessionStorage.setItem(CHAVE_SESSAO, sessao);
            localStorage.removeItem(CHAVE_LEMBRAR);
          }
        } catch {
          mensagem.textContent = "Não foi possível salvar a sessão.";
          return;
        }

        window.location.href = "home.html";
      });

    document
      .getElementById("esqueciSenha")
      .addEventListener("click", function (e) {
        e.preventDefault();

        alert(
          "A recuperação de senha ainda não está configurada."
        );
      });
  </script>
</body>
</html>
