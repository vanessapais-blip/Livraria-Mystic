<html lang="pt-BR">

    nav a {

    nav a:hover {

    }

      padding: 0 25px;

    }

      color: #aaaaaa;
      font-size: 17px;
    }

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }
