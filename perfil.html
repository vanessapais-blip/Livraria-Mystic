<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil — Mystic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #242424;
            color: #eeeeee;
        }

        header {
            background: #303030;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        .marca {
            font-size: 28px;
            font-weight: bold;
        }

        .voltar {
            color: #dddddd;
            text-decoration: none;
        }

        .voltar:hover {
            color: white;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .perfil {
            background: #303030;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
        }

        .foto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #444;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .usuario {
            color: #aaaaaa;
            margin-bottom: 20px;
        }

        .descricao {
            color: #cccccc;
            max-width: 500px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        button {
            background: #eeeeee;
            color: #222;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #cccccc;
        }

        .editar {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #555;
            background: #222;
            color: white;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .salvar {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <div class="marca">Mystic</div>
    <a href="home.html" class="voltar">← Voltar</a>
</header>

<main>

    <section class="perfil">

        <div class="foto">👤</div>

        <h1 id="nome">Seu Nome</h1>

        <div class="usuario" id="usuario">@seuusuario</div>

        <p class="descricao" id="descricao">
            Ainda não há uma descrição.
        </p>

        <button onclick="abrirEdicao()">Editar perfil</button>

        <div class="editar" id="editar">

            <label>Nome</label>
            <input type="text" id="novoNome" placeholder="Seu nome">

            <label>Nome de usuário</label>
            <input type="text" id="novoUsuario" placeholder="@seuusuario">

            <label>Descrição</label>
            <textarea id="novaDescricao" placeholder="Fale um pouco sobre você..."></textarea>

            <button class="salvar" onclick="salvarPerfil()">
                Salvar alterações
            </button>

        </div>

    </section>

</main>

<script>

function abrirEdicao() {
    document.getElementById("editar").style.display = "block";

    document.getElementById("novoNome").value =
        document.getElementById("nome").textContent;

    document.getElementById("novoUsuario").value =
        document.getElementById("usuario").textContent;

    document.getElementById("novaDescricao").value =
        document.getElementById("descricao").textContent.trim();
}

function salvarPerfil() {

    let nome = document.getElementById("novoNome").value;
    let usuario = document.getElementById("novoUsuario").value;
    let descricao = document.getElementById("novaDescricao").value;

    if (nome.trim() !== "") {
        document.getElementById("nome").textContent = nome;
    }

    if (usuario.trim() !== "") {
        document.getElementById("usuario").textContent = usuario;
    }

    if (descricao.trim() !== "") {
        document.getElementById("descricao").textContent = descricao;
    }

    document.getElementById("editar").style.display = "none";
}

</script>

</body>
</html>
