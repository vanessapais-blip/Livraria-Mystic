<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil — Mystic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #242424;
            color: #eeeeee;
        }

        header {
            background: #303030;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
        }

        .marca {
            font-size: 28px;
            font-weight: bold;
        }

        .voltar {
            color: #dddddd;
            text-decoration: none;
        }

        .voltar:hover {
            color: white;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .perfil {
            background: #303030;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
        }

        .foto {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #444;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .usuario {
            color: #aaaaaa;
            margin-bottom: 20px;
        }

        .descricao {
            color: #cccccc;
            max-width: 500px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        button {
            background: #eeeeee;
            color: #222;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
